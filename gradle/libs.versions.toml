# 版本目录（统一管理，规范第 6 条：版本统一规范）
[versions]
agp = "8.11.2"
# Kotlin 2.2.0：KSP 明确提供 2.2.0-2.0.2 与之对应（2.2.10/2.2.21 均无配套 KSP）。
# 不能上 2.3.x —— 2.3 需要 Hilt ≥2.59，而 2.59+ 改用 AGP 9 的 ScopedArtifact API，
# 与本项目 AGP 8.11.2 冲突（会报 ScopedArtifact$POST_COMPILATION_CLASSES 找不到）。
# 该组合已足以支撑 Compose BOM 2026.04.01（material3 1.4.0）。
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
# core-ktx 1.19.0 要求 AGP ≥9.1 且 compileSdk ≥37，本项目 AGP 8.11.2 故维持 1.16.0
coreKtx = "1.16.0"
activityCompose = "1.11.0"
# Compose BOM 2026.04.01 → material3 1.4.0 / compose 1.11.x（Material 3 Expressive，Android 16 适配）
composeBom = "2026.04.01"
lifecycle = "2.9.0"
navigationCompose = "2.9.0"
# Hilt 2.56.2 是当前真实存在的最新稳定版（Maven Central 上 2.57+ 并不存在）。
# 它能覆盖 Kotlin 2.2 的元数据格式，且仍兼容 AGP 8.x。
hilt = "2.56.2"
hiltNavigationCompose = "1.2.0"
# Room 2.7+ 才支持 KSP2（2.6.1 用旧 KSP API，会报 unexpected jvm signature）
room = "2.7.2"
coroutines = "1.9.0"
serialization = "1.7.3"
okhttp = "4.12.0"
ktor = "3.0.3"
xmlutil = "0.91.1"
coil = "2.7.0"
media3 = "1.9.3"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# 协程 / 序列化
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# 网络
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
xmlutil-serialization = { group = "io.github.pdvrieze.xmlutil", name = "serialization", version.ref = "xmlutil" }

# 图片
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# 视频播放（Media3 ExoPlayer）
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Motion Photo（LIVE 图）合成：media3-common(MimeTypes/UnstableApi) + media3-muxer(MuxerUtil)
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-muxer = { group = "androidx.media3", name = "media3-muxer", version.ref = "media3" }
# LIVE 图选段裁剪 + 编码归一（H.264/1080p）：Transformer + Presentation 缩放特效
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version = "1.4.1" }

# QR 扫码配网（zxing 纯 Java 解码器，无 GMS 依赖；CameraX 取景与分析）
zxing-core = { group = "com.google.zxing", name = "core", version = "3.5.3" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version = "1.3.4" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version = "1.3.4" }
camera-view = { group = "androidx.camera", name = "camera-view", version = "1.3.4" }

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
