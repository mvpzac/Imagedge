name: CI

on:
  push:
    # alpha 是当前主力开发分支（0.2.0-alpha0x 在此迭代），必须纳入 CI 把关
    branches: [ main, alpha ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 自动缓存 Gradle 依赖与 wrapper（首次慢，后续增量）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      # UI 规范检查：feature/ 下禁止直接使用 M3 原生控件（docs/UI-SPEC.md §6.1）。
      # 放在 lint 之前——这条失败的信息比 lint 更直白（直接指出该用哪个设计系统组件）。
      - name: UI spec check
        run: ./gradlew :app:uiSpecCheck --stacktrace

      - name: Lint (app)
        run: ./gradlew :app:lintDebug --stacktrace

      # Release 构建：验证签名配置检测、R8/资源处理路径与 debug 不同，
      # 避免「debug 能过、release 挂了」直到发版才发现
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
