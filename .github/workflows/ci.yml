name: CI

on:
  push:
    # alpha 是当前主力开发分支（0.2.0-alpha0x 在此迭代），必须纳入 CI 把关
    branches: [ main, alpha ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      # 自动缓存 Gradle 依赖与 wrapper（首次慢，后续增量）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Unit tests
        run: ./gradlew test --stacktrace

      # UI 规范检查：feature/ 下禁止直接使用 M3 原生控件（docs/UI-SPEC.md §6.1）。
      # 放在 lint 之前——这条失败的信息比 lint 更直白（直接指出该用哪个设计系统组件）。
      - name: UI spec check
        run: ./gradlew :app:uiSpecCheck --stacktrace

      - name: Lint (all Android modules)
        run: ./gradlew lint --stacktrace

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --stacktrace

      # Release 构建：验证签名配置检测、R8/资源处理路径与 debug 不同，
      # 避免「debug 能过、release 挂了」直到发版才发现
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore

      - name: Upload SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cyclonedx-sbom
          path: build/reports/cyclonedx/bom.*

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
